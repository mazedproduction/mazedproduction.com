itorial — photograph 12"></button><figcaption><span>FY_12.JPG</span><span>12 / 13</span></figcaption></figure><figure><button type="button" data-photo="12" aria-label="Open photograph 13"><img src="/assets/fucking-young/13.svg" width="1113" height="1440" loading="lazy" decoding="async" alt="Fucking Young Magazine editorial — photograph 13"></button><figcaption><span>FY_13.JPG</span><span>13 / 13</span></figcaption></figure></section></main><dialog class="image-viewer" aria-label="Photograph viewer"><div class="viewer-top"><span class="mono">FUCKING YOUNG MAGAZINE</span><button data-close data-text="close" type="button">CLOSE</button></div><img alt=""><button class="viewer-arrow viewer-prev" type="button" aria-label="Previous photograph">←</button><button class="viewer-arrow viewer-next" type="button" aria-label="Next photograph">→</button><div class="viewer-caption"></div></dialog><footer><a href="/#work" data-work-link data-text="footer">BACK TO WORK ↑</a><span>©2023 MAZEDPRODUCTION. ALL RIGHTS RESERVED</span></footer><script>const words={en:{back:'BACK TO WORK',intro:'Fucking Young Magazine editorial — a photographic series.',small:'ARCHIVE',large:'LARGE VIEW',close:'CLOSE',previous:'Previous photograph',next:'Next photograph',open:'Open photograph',label:'PROJECT 002 / EDITORIAL',footer:'BACK TO WORK ↑'},fr:{back:'RETOUR AUX PROJETS',intro:'Éditorial pour Fucking Young Magazine — une série photographique.',small:'ARCHIVE',large:'GRAND FORMAT',close:'FERMER',previous:'Photographie précédente',next:'Photographie suivante',open:'Ouvrir la photographie',label:'PROJET 002 / ÉDITORIAL',footer:'RETOUR AUX PROJETS ↑'}};
let lang=new URLSearchParams(location.search).get('lang')==='fr'?'fr':'en';
const grid=document.querySelector('.archive-grid'),viewer=document.querySelector('.image-viewer'),viewImage=viewer.querySelector('img'),photos=[...grid.querySelectorAll('img')];let current=0;let originButton;
function applyLanguage(){const t=words[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-text]').forEach(el=>el.textContent=t[el.dataset.text]);document.querySelector('[data-lang-toggle]').textContent=lang==='fr'?'EN':'FR';document.querySelector('[data-lang-toggle]').setAttribute('aria-label',lang==='fr'?'Switch site to English':'Passer le site en français');document.querySelectorAll('[data-photo]').forEach((el,i)=>el.setAttribute('aria-label',t.open+' '+(i+1)));document.querySelector('.viewer-prev').setAttribute('aria-label',t.previous);document.querySelector('.viewer-next').setAttribute('aria-label',t.next);document.querySelector('[data-view=small]').textContent=t.small;document.querySelector('[data-view=large]').textContent=t.large;document.querySelectorAll('[data-work-link]').forEach(el=>el.href='/?lang='+lang+'#work');}
document.querySelector('[data-lang-toggle]').addEventListener('click',()=>{lang=lang==='fr'?'en':'fr';const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);applyLanguage();});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{grid.classList.toggle('large',b.dataset.view==='large');document.querySelectorAll('[data-view]').forEach(other=>other.setAttribute('aria-pressed',String(b===other)));}));
function showPhoto(i){current=(i+photos.length)%photos.length;viewImage.src=photos[current].src;viewImage.alt=photos[current].alt;document.querySelector('.viewer-caption').textContent='FUCKING YOUNG MAGAZINE EDITORIAL / '+String(current+1).padStart(2,'0')+' — 13';}
function openPhoto(i,button){originButton=button;showPhoto(i);viewer.showModal();document.body.style.overflow='hidden';}
document.querySelectorAll('[data-photo]').forEach(b=>b.addEventListener('click',()=>openPhoto(Number(b.dataset.photo),b)));
viewer.querySelector('[data-close]').addEventListener('click',()=>viewer.close());
viewer.addEventListener('close',()=>{document.body.style.overflow='';originButton?.focus();});
viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();showPhoto(current-1)}if(e.key==='ArrowRight'){e.preventDefault();showPhoto(current+1)}});
document.querySelector('.viewer-prev').addEventListener('click',()=>showPhoto(current-1));document.querySelector('.viewer-next').addEventListener('click',()=>showPhoto(current+1));
let touchX=null;viewer.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{if(touchX!==null){const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>50)showPhoto(current+(dx<0?1:-1));touchX=null;}},{passive:true});
applyLanguage();const selected=Number(location.hash.slice(1));if(Number.isInteger(selected)&&selected>=1&&selected<=13)openPhoto(selected-1,grid.querySelector('[data-photo="'+(selected-1)+'"]'));</script></body></html>
